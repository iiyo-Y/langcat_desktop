# 三平台并行打包 + 自动上传到 GitHub Releases
#
# 触发:推送 v* 这种 tag(由 `pnpm release` 脚本一键产生)
#
# 每个平台一个 runner 各打各的:
# - macOS:   产 .dmg(arm64 + x64)
# - Windows: 产 .exe(NSIS,x64)
# - Linux:   产 .AppImage(x64)
#
# 产物会被 electron-builder 自动上传到对应 tag 的 GitHub Release,
# 同时生成 latest{,-mac,-linux}.yml 给 electron-updater 读。
#
# 假设:本仓库根目录 == langcat_desktop/。如果把它纳入更大的 monorepo,
# 给所有 step 加 `working-directory: langcat_desktop` 或调 paths。

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 上传 release 资产 + 创建 release 必需

jobs:
  build:
    name: build (${{ matrix.os }} → ${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 + arm64(同一 ubuntu runner cross-build)
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
          # Windows x64 + arm64(同一 windows-latest runner cross-build)
          - os: windows-latest
            platform: win
            arch: x64
          - os: windows-latest
            platform: win
            arch: arm64
          # macOS x64 + arm64 都用 macos-latest(=macos-14 Apple Silicon)cross-build。
          # 早期 v0.4.x 拆 macos-13(Intel)+ macos-14(Silicon)是为 nut-js native
          # cross-arch prebuilt 缺失;v0.5.0 撤掉 nut-js 后纯 JS,cross-arch 无风险。
          # 改用单 runner 出两 arch 的好处:
          #   1. 避开 macos-13 deprecated runner queue 拥堵(几十分钟到几小时)
          #   2. 共用 install / build 步,总 CI 时间更短
          #   3. 公证只跑一次 polling,Apple notarytool 资源使用更轻
          - os: macos-latest
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 从 build/icon.png(1024x1024)显式生成各平台原生图标:
      #   - macOS 需要 .icns(否则 Dock 不显示 icon,默认变灰白电子图标)
      #   - Windows 需要 .ico(NSIS installer 要)
      # electron-builder 默认会从 PNG 自动转,但实测某些尺寸 / alpha 处理有问题。
      # png2icons 是纯 JS 跨平台库,不引入原生编译依赖,一行命令搞定。
      - name: Generate native icons (.icns / .ico)
        # 强制 bash —— Windows runner 默认 PowerShell,npx --yes 路径解析 / 多行
        # `|` heredoc 在 PowerShell 下行为不一致,bash(Git Bash)三平台一致
        shell: bash
        run: |
          npx --yes png2icons build/icon.png build/icon -allp
          ls -la build/

      # 关键:把 git tag (例如 refs/tags/v0.1.1 → 0.1.1) 同步进 package.json version。
      # electron-builder 用 package.json.version 拼 release tag 名(v0.1.0),
      # 跟 push 上来的 git tag 不一致就会去找/创建错误的 release,产物 silent
      # 上传到错误 tag,真实 v0.1.1 release 看不到东西。
      - name: Sync package.json version with git tag
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "git tag = $TAG_NAME, version = $VERSION"
          # --no-git-tag-version 防止 npm/pnpm 自动 commit + tag(workflow 里没用)
          npm pkg set version="$VERSION"
          echo "package.json now:"
          npm pkg get version

      - name: Build (renderer + electron main)
        # build 时把生产 API URL + Supabase 公开 key inline 到 main bundle。
        # 这两个值都是公开的(API 接 Bearer + RLS 保护、anon key 设计上公开),
        # 但仍然走 GitHub Secrets 集中管理,改值不用动代码或 commit。
        env:
          VITE_LANGCAT_API_BASE_URL: ${{ secrets.LANGCAT_API_BASE_URL }}
          VITE_LANGCAT_SUPABASE_URL: ${{ secrets.LANGCAT_SUPABASE_URL }}
          VITE_LANGCAT_SUPABASE_ANON_KEY: ${{ secrets.LANGCAT_SUPABASE_ANON_KEY }}
        run: pnpm build

      # 仅 macOS:手动 import .p12 到临时 keychain,绕开 electron-builder
      # 内部"自动 detect" 路径(那条路径在某些 GitHub Actions runner 上 silent
      # skip 签名 —— v0.6.4 验证了 secrets 注入完美但 codesign 仍然没跑)。
      # 这是 electron-builder 文档推荐的 manual signing setup,稳妥可控。
      - name: macOS - manual keychain setup (import Developer ID cert)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="tempPass$(date +%s)"
          P12_PATH="$RUNNER_TEMP/cert.p12"

          # base64 → .p12
          echo "$CSC_LINK" | base64 --decode > "$P12_PATH"
          echo "p12 written: $(stat -f%z "$P12_PATH") bytes"

          # 创建临时 keychain
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # 把 build.keychain 加到搜索列表(必须 + 当前 default)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # import .p12(-T /usr/bin/codesign:让 codesign 能用这个 key 不弹密码)
          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # 设置 partition list(macOS 12+ 必须,否则 codesign 仍会被 ACL 拦)
          security set-key-partition-list \
            -S "apple-tool:,apple:,codesign:" \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # 验证证书在 keychain
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # 清理 .p12 临时文件
          rm "$P12_PATH"

          # 把 keychain 路径暴露给后续 step(electron-builder 看到 CSC_KEYCHAIN
          # 会优先用这个 keychain,不再创建临时的;如果没设它会自己 detect
          # default keychain,我们刚把它设成 build.keychain,自动命中)
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS" >> "$GITHUB_ENV"

      - name: Package & publish
        # --publish always:不管签名状态,产物都上传到对应 tag 的 release
        # GH_TOKEN: GitHub Actions 自动注入,electron-builder 用它调 GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ─────────── macOS 签名 + 公证(Apple Developer ID) ───────────
          # 仅 macOS job 有效;Windows / Linux 上这些 env 是空字符串,无副作用。
          #
          # 关键变化(v0.6.5+):**不再传 CSC_LINK / CSC_KEY_PASSWORD 给 electron-builder**!
          # 上一步「manual keychain setup」已经手动 import .p12 到 build.keychain
          # 并设为 default。electron-builder 不传 CSC_LINK 时不再走"自动 detect"
          # silent skip 路径,而是直接用当前 default keychain 里的 Developer ID
          # 证书签名。
          #
          # APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID:notarytool 三件套,
          # electron-builder 25+ 看到自动启用公证。
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows 签名(将来准备好 .pfx 证书后填)
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        # --${{ matrix.platform }} 平台 + --${{ matrix.arch }} 显式 arch
        # 让 electron-builder 单 arch 构建(不再 [arm64,x64] cross),配合 matrix
        # 拆 macos-13 / macos-14 两个 native runner,nut-js 只用 host 自身 prebuilt
        run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish always --config electron-builder.yml
