# electron-builder 跨平台打包配置
#
# 一键三平台:`pnpm package:all` 同时产出 macOS .dmg + Windows .exe + Linux .AppImage
# 单平台:`pnpm package:mac` / `package:win` / `package:linux`
#
# 注意:
# - macOS 包要在 macOS 上签名(没有签名的 .dmg 用户首次打开要绕 Gatekeeper)
# - Windows 包要在 Windows 或 Linux + wine 上构建,生产签名需要 cert
# - Linux 不签名,直接产出 AppImage(免安装)

appId: app.langcat.desktop
productName: LangCat
copyright: Copyright © 2026 LangCat
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build

files:
  - dist
  - dist-electron
  - package.json

# 任何 .node native 文件必须从 asar 解出来才能 dlopen(electron-updater 等可能有)
asarUnpack:
  - "**/*.node"

mac:
  # App Store 分类(已有,保留):教育类
  category: public.app-category.education
  # 用 .icns(release.yml 跑 png2icons 从 icon.png 生成)— PNG 路径 macOS Dock
  # 不显示 logo,必须 .icns
  icon: build/icon.icns
  # 强制 ad-hoc 签名(identity 设成 "-" 是 codesign 的 ad-hoc 标记)。
  # 不设的话 electron-builder 在 GitHub Actions runner 上(没真证书)会
  # 直接 skip codesign,产物 `codesign -dv` 报 "code object is not signed at all",
  # macOS 13+ 严格模型下系统拒绝读 .icns,Dock 显示默认电子图标。
  # ad-hoc 签名跟 Apple Developer ID 完全不同(用户首次启动仍要绕 Gatekeeper),
  # 但能让系统正常读 Resources/Info.plist,Dock 上 logo 才会显示出来。
  identity: '-'
  target:
    - target: dmg
      arch: [arm64, x64]
  # ─────────────────────────────────────────────────────────────
  # 不签名场景下的 macOS 关键开关(我们没付 $99 Apple Developer Program)
  # ─────────────────────────────────────────────────────────────
  # hardened runtime:Apple 强化运行时,要求所有 dylib 必须签名 + notarized。
  # 没签名硬开会让 macOS 13+ 直接拒绝启动(报 "代码签名无效")。
  # 真正签名时再翻成 true。
  hardenedRuntime: false
  # 跳过 electron-builder 内部对 dmg 做 spctl Gatekeeper 评估
  # —— 在没签名的 macOS runner 上 build 会因 spctl 校验失败而中断。
  gatekeeperAssess: false
  # entitlements:即使不签名,Info.plist 的 Usage Description + entitlements
  # 仍是 osascript / Accessibility 等系统对话框的合法依据。
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 保留 macOS 原生 dark mode 适配能力(产品本身是品牌色,但系统级 chrome
  # 例如菜单栏/对话框仍跟随系统主题)
  darkModeSupport: true
  # ─────────────────────────────────────────────────────────────
  # 自定义 Info.plist 字段(extendInfo 会 merge 到产物的 Info.plist)
  # ─────────────────────────────────────────────────────────────
  extendInfo:
    # 显式声明这是一个普通 Dock app(不是 menu bar agent)
    # 改成 true 会让窗口/Dock 图标消失,变成 status bar app —— 我们不要
    LSUIElement: false
    # ⚠️ 关键:osascript 模拟 Cmd+C 必须有这条 Usage Description,
    # 否则 macOS 拒绝弹"允许控制其他应用"对话框,功能直接不可用。
    NSAppleEventsUsageDescription: "LangCat 需要在你按下查词快捷键时,模拟一次 Cmd+C 复制你选中的单词。授权后才能让“选中即查”流畅工作。"
    # 显式声明本 app 会跑 AppleScript / Apple Events
    NSAppleScriptEnabled: true

# ─────────────────────────────────────────────────────────────
# DMG 视觉:用户双击 .dmg 后看到的安装窗口
# 标准 macOS 风格 —— 左边 app 图标,右边 Applications 文件夹快捷方式,
# 用户拖动安装。
# ─────────────────────────────────────────────────────────────
dmg:
  title: "LangCat ${version}"
  iconSize: 128
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  # 同理 NSIS installer 要 .ico
  icon: build/icon.ico
  target:
    - target: nsis
      # x64 主流;arm64 给 Surface Pro X / 高通 Snapdragon X / Copilot+ PC;
      # ia32 故意不加 —— Win 32-bit 用户已极少,产物多 50% 体积不值
      arch: [x64, arm64]

linux:
  icon: build/icon.png
  category: Education
  target:
    - target: AppImage
      # x64 桌面主流;arm64 给 ARM 服务器 / Raspberry Pi 5 / Apple Silicon Linux 虚拟机
      arch: [x64, arm64]

# 发布配置 —— 自动更新数据源
#
# provider: github 时 electron-builder 在打包后(--publish always)会上传产物到
# 对应 tag 的 GitHub Release,并生成 latest{,-mac,-linux}.yml 给 electron-updater 读取。
#
# owner/repo 不显式写,由以下顺序自动推断:
#   1. CI 环境变量 GITHUB_REPOSITORY(GitHub Actions 自动注入,推荐)
#   2. package.json 的 repository 字段
#   3. 本地 git remote origin
#
# 想换成 S3 / 腾讯云 / 自建 HTTPS 静态服务器时,把 provider 改成 generic 并填 url:
#   - provider: generic
#     url: https://download.langcat.example/desktop/
publish:
  - provider: github
    releaseType: release
