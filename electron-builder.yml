# electron-builder 跨平台打包配置
#
# 一键三平台:`pnpm package:all` 同时产出 macOS .dmg + Windows .exe + Linux .AppImage
# 单平台:`pnpm package:mac` / `package:win` / `package:linux`
#
# 注意:
# - macOS 包要在 macOS 上签名(没有签名的 .dmg 用户首次打开要绕 Gatekeeper)
# - Windows 包要在 Windows 或 Linux + wine 上构建,生产签名需要 cert
# - Linux 不签名,直接产出 AppImage(免安装)

appId: app.langcat.desktop
productName: LangCat
copyright: Copyright © 2026 LangCat
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build

files:
  - dist
  - dist-electron
  - package.json

# 任何 .node native 文件必须从 asar 解出来才能 dlopen(electron-updater 等可能有)
asarUnpack:
  - "**/*.node"

mac:
  # App Store 分类(已有,保留):教育类
  category: public.app-category.education
  # 用 .icns(release.yml 跑 png2icons 从 icon.png 生成)— PNG 路径 macOS Dock
  # 不显示 logo,必须 .icns
  icon: build/icon.icns
  # 真实 Developer ID Application 签名(Apple 颁发的证书,Team ID FVNGXL47JQ)。
  # 之前是 ad-hoc '-' 仅让 .icns 显示;现在 Apple Developer Program 已注册,
  # 走完整 Developer ID + 公证流程,Gatekeeper 不再警告,electron-updater
  # 可正常自动安装新版(这是 Apple 强约束:macOS 自动更新需要签名 + 公证)。
  #
  # identity: null 让 electron-builder 自动从 keychain / CSC_LINK 解码后的
  # .p12 里 detect 第一个 Developer ID Application 证书。我们 .p12 里只有一个
  # Developer ID 证书(就是 LUO YI JIA / FVNGXL47JQ),自动选稳。
  # 早版本写 'Developer ID Application: LUO YI JIA (FVNGXL47JQ)' 全名,
  # electron-builder 25+ 改要求"不带 prefix",直接 null 跳过这种风格争议。
  # 不设 identity 字段:让 electron-builder 默认行为 = 从当前 default keychain
  # 自动找 Developer ID Application 证书。release.yml 的 manual keychain setup
  # 已经把证书 import 到 build.keychain 并设为 default,electron-builder 自动命中。
  # 注意:identity: null 不等于"自动 detect",是"显式跳过签名"——v0.6.x 这个 bug 源头
  #
  # Hardened Runtime — 公证(notarization)的强制要求,跟 entitlements 配套
  hardenedRuntime: true
  # 公证审核仍然让 build 直接产 dmg,不卡 spctl(本地 build 时 GitHub runner
  # 不一定能 reach Apple,gatekeeperAssess 关掉避开非关键检查)
  gatekeeperAssess: false
  # entitlements 已存在(build/entitlements.mac.plist),hardened runtime 必须配
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 公证完全靠 release.yml 注入的 env:
  #   APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
  # electron-builder 25+ 看到这三个 env 自动启用 notarytool。
  # 不在 yml 里写 notarize.teamId(v0.6.7 build log 提示
  # "Please specify ... in the APPLE_TEAM_ID env var instead of notarize.teamId")
  # 保留 macOS 原生 dark mode 适配能力(产品 UI 是品牌色,但 system-level
  # chrome 比如对话框/菜单栏仍跟随系统主题)
  darkModeSupport: true
  target:
    # 不写 arch,让 release.yml 的 CLI --arch 决定(matrix 里每 job 单 arch);
    # 之前 yml 写 [arm64, x64] 不被 CLI override,导致同 job build 两次,
    # hdiutil mount 同名 volume "LangCat 0.6.x" race detach 失败
    - target: dmg     # 用户首次下载 / 手动安装用
    - target: zip     # ⚠️ electron-updater 在 macOS 上自动更新**必须** .zip
                      # 不是 .dmg!没 zip 时 v0.6.8 之前升级永远报
                      # ERR_UPDATER_ZIP_FILE_NOT_FOUND silent skip。
  # 自定义 Info.plist 字段
  extendInfo:
    # 显式声明这是一个普通 Dock app(不是 menu bar agent)。改成 true 会让
    # 窗口 / Dock 图标消失变成 status bar app —— LangCat 不要那种行为
    LSUIElement: false

# ─────────────────────────────────────────────────────────────
# DMG 视觉:用户双击 .dmg 后看到的安装窗口
# 标准 macOS 风格 —— 左边 app 图标,右边 Applications 文件夹快捷方式,
# 用户拖动安装。
# ─────────────────────────────────────────────────────────────
dmg:
  title: "LangCat ${version}"
  iconSize: 128
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  # 同理 NSIS installer 要 .ico
  icon: build/icon.ico
  target:
    # arch 完全交 CLI --arch(同 mac block 注释)
    - target: nsis

linux:
  icon: build/icon.png
  category: Education
  target:
    # arch 完全交 CLI --arch
    - target: AppImage

# 发布配置 —— 自动更新数据源
#
# provider: github 时 electron-builder 在打包后(--publish always)会上传产物到
# 对应 tag 的 GitHub Release,并生成 latest{,-mac,-linux}.yml 给 electron-updater 读取。
#
# owner/repo 不显式写,由以下顺序自动推断:
#   1. CI 环境变量 GITHUB_REPOSITORY(GitHub Actions 自动注入,推荐)
#   2. package.json 的 repository 字段
#   3. 本地 git remote origin
#
# 想换成 S3 / 腾讯云 / 自建 HTTPS 静态服务器时,把 provider 改成 generic 并填 url:
#   - provider: generic
#     url: https://download.langcat.example/desktop/
publish:
  - provider: github
    releaseType: release
